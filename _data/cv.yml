    Projects:
      - name: Lilac Trio
        url: https://github.com/AKooshan82/lilac-trio
        summary: Meta-reinforcement learning codebase for tracking task non-stationarity, including LILAC, RL2, Thompson sampling, and Bayes-policy experiment paths.
        highlights:
          - Includes AntGoal, Cheetah velocity, MiniGolf, and MiniGolf-with-signals environments.
          - Provides training, meta-testing, robustness evaluation, checkpoint inspection, and plotting utilities.

      - name: Multi-Armed Bandits for Online Decision-Making
        summary: Implemented and evaluated bandit algorithms for exploration-exploitation optimization.
        highlights:
          - Built epsilon-Greedy, UCB, and Thompson Sampling methods with Python, NumPy, Pandas, Matplotlib, and Git.
          - Evaluated behavior under non-stationary settings and applied the methods to financial trading strategies.

      - name: Deep Generative Models for Adversarial Attacks on LLMs
        summary: Used generative modeling to synthesize adversarial prompts and probe large-language-model robustness.
        highlights:
          - Evaluated attack success rates under different safety filters.
          - Investigated mitigation strategies for improving model robustness.

      - name: Seizure Prediction Using Machine Learning Methods
        summary: Developed seizure-prediction experiments using spectral entropy features from EEG signals.
        highlights:
          - Applied KNN, SVM, regression methods, and artificial neural networks.
          - Connected signal-processing features with neurological monitoring applications.

      - name: Conjugate Gradient Methods for Hessian-Free Optimization
        summary: Implemented convex optimization algorithms from scratch for portfolio optimization and sparse regression.
        highlights:
          - Reached optimality gaps at or below 1e-6 in numerical experiments.
          - Achieved 3-5x speedups over standard solver baselines in tested settings.

